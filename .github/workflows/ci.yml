name: Synthetic research workflow
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Test data validation and workflow behavior
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: python scripts/run_pipeline.py --config config/demo.toml
      - name: Check reproducibility
        run: python scripts/verify_reproducibility.py
