name: Synthetic research workflow
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Test data validation and workflow behavior
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: python scripts/run_pipeline.py --config config/demo.toml
      - name: Check reproducibility
        run: python scripts/verify_reproducibility.py
